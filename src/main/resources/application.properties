# ============================================================
# SGB - Modulos Servicio y Cita (API REST)
# Configuracion de conexion a la base de datos y de JPA/Hibernate.
# ============================================================

# --- Conexion a MySQL (XAMPP) ---
# IMPORTANTE: en la maquina donde se probo este proyecto, XAMPP usa el
# puerto 3307 (no el 3306 por defecto), usuario root y sin contrasena.
# Es la misma configuracion que ya se documento en el README de la
# Evidencia GA7-220501096-AA2-EV01/EV02. Si en tu maquina el puerto es
# distinto, cambia solo el numero de puerto en la siguiente linea.
spring.datasource.url=jdbc:mysql://localhost:3307/sgb?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# ddl-auto=validate: Hibernate NO crea ni modifica tablas, solo verifica
# que las entidades Java coincidan con las tablas que ya existen en la
# base de datos 'sgb' (creada por sgb.sql). Se usa "validate" y no
# "update" a proposito: la base de datos real ya existe con datos de
# prueba (usuarios, roles) y no queremos que Hibernate la altere sola.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Servidor ---
server.port=8081

# Por defecto, Spring Boot oculta el mensaje detallado de los errores en
# la respuesta JSON (por seguridad, para no revelar detalles internos a
# desconocidos). Aqui se activa a proposito para las pruebas: asi el
# probador.html muestra el motivo exacto (por ejemplo, "el usuario X no
# tiene el rol de Barbero") en vez de solo el codigo 400/404 sin explicacion.
server.error.include-message=always
server.error.include-binding-errors=always
